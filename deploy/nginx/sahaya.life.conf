# sahaya.life -- the web app, a static bundle from web/dist.
#
# Install:
#   sudo cp deploy/nginx/sahaya.life.conf /etc/nginx/sites-available/sahaya.life
#   sudo ln -s /etc/nginx/sites-available/sahaya.life /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot, which rewrites this file to add the TLS block and the
# redirect. Nothing here touches any other site on the box.

server {
    listen 80;
    listen [::]:80;
    server_name sahaya.life www.sahaya.life;

    root /var/www/sahaya/web/dist;
    index index.html;

    # The API lives on its own name (api.sahaya.life); this server only ever
    # serves files. Keeping them separate is why the bundle is built with
    # VITE_API_URL pointing at the API's origin.

    access_log /var/log/nginx/sahaya.access.log;
    error_log  /var/log/nginx/sahaya.error.log;

    # A React Router app: every path that is not a file is the app itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they can be cached forever. The
    # entry point must not be: a cached index.html would keep pointing at the
    # previous build's assets after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The share card and the icons change rarely but must not be stale for a
    # year when they do.
    location ~* \.(png|ico|svg|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Modest hardening. No CSP here: the app loads Google Fonts and Razorpay's
    # checkout, and a policy written blind would break one of them silently.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
}
