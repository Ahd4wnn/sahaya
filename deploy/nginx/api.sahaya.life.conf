# api.sahaya.life -- FastAPI behind uvicorn, plus the uploaded photos.
#
# Install:
#   sudo cp deploy/nginx/api.sahaya.life.conf /etc/nginx/sites-available/api.sahaya.life
#   sudo ln -s /etc/nginx/sites-available/api.sahaya.life /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This port must match the --port in deploy/sahaya-api.service. 8021 is the
# default; check it is free on this box before you commit to it:
#   sudo ss -ltnp | grep 8021

upstream sahaya_api {
    server 127.0.0.1:8021;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.sahaya.life;

    access_log /var/log/nginx/sahaya-api.access.log;
    error_log  /var/log/nginx/sahaya-api.error.log;

    # Photos are 8MB at the upload limit the API enforces; leave room for the
    # multipart envelope so a rejected upload is rejected by the API, with a
    # sentence a person can read, rather than by nginx with a bare 413.
    client_max_body_size 12m;

    # ---------------------------------------------------------------- media --
    # Verification documents are government IDs. The API refuses to serve
    # anything under `private/` (app/main.py, PublicMedia) -- and nginx is
    # serving this directory directly, so that guard has to exist here too.
    # Without these three lines, an ID is one guessed URL away from anybody.
    location ^~ /media/private {
        return 404;
    }

    location /media/ {
        alias /var/www/sahaya/backend/var/uploads/;
        # Filenames carry a version (photo-<hex>.png), so a new upload is a new
        # URL and this can be cached hard.
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------- websocket --
    # The realtime socket. Long-lived by design, so the read timeout has to be
    # generous: the client pings every 25s to keep proxies from cutting it.
    location /api/v1/ws {
        proxy_pass http://sahaya_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ------------------------------------------------------------------ api --
    location / {
        proxy_pass http://sahaya_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Ask Sahaya waits on the model: a reply can take ten seconds or more,
        # and the default 60s is not enough head room for a slow one.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
